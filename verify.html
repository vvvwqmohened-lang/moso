<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من الرقم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #667eea, #764ba2, #6b8cff, #a463f5);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .verify-card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 50px 40px;
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.3);
            z-index: 2;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        h2 {
            color: white;
            margin-bottom: 15px;
            font-weight: 600;
            text-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        p {
            color: rgba(255,255,255,0.9);
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 30px;
        }
        .input-group i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.8);
            font-size: 1.3rem;
            transition: all 0.3s;
        }
        .input-group input {
            width: 100%;
            padding: 18px 50px 18px 20px;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 60px;
            font-size: 1.5rem;
            letter-spacing: 8px;
            text-align: center;
            color: white;
            transition: all 0.3s;
            outline: none;
        }
        .input-group input::placeholder {
            color: rgba(255,255,255,0.5);
            letter-spacing: normal;
        }
        .input-group input:focus {
            border-color: white;
            background: rgba(255,255,255,0.25);
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        .input-group input:focus + i {
            color: white;
            transform: translateY(-50%) scale(1.1);
        }

        /* النافذة المنبثقة */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
        }
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            transform: scale(0.7);
            transition: transform 0.3s;
        }
        .modal-overlay.show .modal-content {
            transform: scale(1);
        }
        .success-circle {
            width: 120px;
            height: 120px;
            background: #4caf50;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            font-size: 4rem;
            color: white;
            box-shadow: 0 10px 30px rgba(76,175,80,0.4);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76,175,80,0.7); }
            70% { box-shadow: 0 0 0 20px rgba(76,175,80,0); }
            100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); }
        }
        .modal-content h3 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 10px;
        }
        .modal-content p {
            color: #666;
            font-size: 1.2rem;
        }

        /* أيقونات عائمة */
        .floating-icons {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .floating-icons i {
            position: absolute;
            color: rgba(255,255,255,0.1);
            font-size: 2rem;
            animation: float 6s linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="floating-icons" id="floatingIcons"></div>

    <div class="verify-card">
        <div class="logo">التحقق</div>
        <h2>رمز التحقق</h2>
        <p>تم إرسال رمز من 6 أرقام إلى هاتفك</p>

        <form id="verifyForm">
            <div class="input-group">
                <i class="fas fa-key"></i>
                <input type="text" id="code" required maxlength="6" pattern="\d{6}" inputmode="numeric" autocomplete="off" placeholder="_ _ _ _ _ _">
            </div>
        </form>
    </div>

    <!-- النافذة المنبثقة للنجاح -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-content">
            <div class="success-circle">
                <i class="fas fa-check"></i>
            </div>
            <h3>تم التحقق بنجاح!</h3>
            <p>جاري تحويلك...</p>
        </div>
    </div>

    <script src="script (2).js"></script>
    <script>
        // إنشاء أيقونات عائمة
        function createFloatingIcons() {
            const container = document.getElementById('floatingIcons');
            const icons = ['fa-star', 'fa-circle', 'fa-square', 'fa-heart', 'fa-moon', 'fa-sun', 'fa-cloud'];
            for (let i = 0; i < 20; i++) {
                const icon = document.createElement('i');
                icon.className = `fas ${icons[Math.floor(Math.random() * icons.length)]}`;
                icon.style.left = Math.random() * 100 + '%';
                icon.style.animationDuration = Math.random() * 10 + 5 + 's';
                icon.style.animationDelay = Math.random() * 5 + 's';
                icon.style.fontSize = Math.random() * 30 + 10 + 'px';
                container.appendChild(icon);
            }
        }
        createFloatingIcons();

        function verifyCode(code) {
            const pendingUser = JSON.parse(sessionStorage.getItem('pendingUser'));
            const modal = document.getElementById('successModal');

            if (!pendingUser) {
                window.location.href = 'register.html';
                return false;
            }

            // أي رمز مكون من 6 أرقام يعتبر صحيحاً (للعرض التوضيحي)
            if (code.length === 6 && /^\d+$/.test(code)) {
                // إظهار النافذة المنبثقة
                modal.classList.add('show');

                // إضافة المستخدم إلى قاعدة البيانات
                const users = getUsers();
                const newUser = {
                    id: Date.now(),
                    fullname: pendingUser.fullname,
                    username: pendingUser.username,
                    email: pendingUser.email,
                    phone: pendingUser.phone,
                    password: pendingUser.password,
                    role: pendingUser.role,
                    verified: true,
                    createdAt: new Date().toISOString()
                };
                users.push(newUser);
                localStorage.setItem('users', JSON.stringify(users));

                // تسجيل الدخول مباشرة
                localStorage.setItem('currentUser', JSON.stringify(newUser));
                sessionStorage.removeItem('pendingUser');

                // تأخير التوجيه حسب الدور
                setTimeout(() => {
                    if (newUser.role === 'user') {
                        window.location.href = 'index.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }, 2000);

                return true;
            }
            return false;
        }

        const codeInput = document.getElementById('code');
        codeInput.addEventListener('input', function() {
            const code = this.value.trim();
            if (code.length === 6) {
                verifyCode(code);
            }
        });

        document.getElementById('verifyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const code = codeInput.value.trim();
            if (code.length === 6) {
                verifyCode(code);
            }
        });
    </script>
</body>
</html>
