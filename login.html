<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - مهند الخضر</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- particles.js library -->
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* خلفية متحركة باستخدام particles.js */
        #particles-js {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* البطاقة الزجاجية */
        .glass-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, fff, 0.2);
            width: 100%;
            max-width: 450px;
            padding: 50px 40px;
            text-align: center;
            animation: fadeInUp 0.8s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* الشعار */
        .logo {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #f0f0f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        h2 {
            color: white;
            margin-bottom: 30px;
            font-weight: 600;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            font-size: 1.8rem;
        }

        /* حقول الإدخال */
        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: right;
        }

        .input-group i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            transition: all 0.3s;
            z-index: 1;
        }

        .input-group input {
            width: 100%;
            padding: 16px 50px 16px 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            font-size: 1rem;
            color: white;
            transition: all 0.3s;
            outline: none;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
            transition: opacity 0.3s;
        }

        .input-group input:focus {
            border-color: white;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .input-group input:focus+i {
            color: white;
            transform: translateY(-50%) scale(1.1);
        }

        /* خيارات إضافية */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            color: white;
            font-size: 0.95rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember input {
            accent-color: white;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .forgot a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
            padding-bottom: 2px;
        }

        .forgot a:hover {
            border-bottom-color: white;
        }

        /* زر تسجيل الدخول */
        .login-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 50px;
            background: white;
            color: #667eea;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(102, 126, 234, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .login-btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        /* رسالة الخطأ */
        .error-msg {
            margin-top: 15px;
            padding: 12px;
            border-radius: 50px;
            background: rgba(239, 68, 68, 0.2);
            color: #fecaca;
            font-weight: 600;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.3);
            backdrop-filter: blur(5px);
        }

        /* روابط إضافية */
        .register-link {
            margin-top: 25px;
            color: white;
        }

        .register-link a {
            color: white;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: border-color 0.3s;
        }

        .register-link a:hover {
            border-bottom-color: white;
        }

        /* بيانات تجريبية */
        .demo-data {
            margin-top: 20px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: white;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        .demo-data span {
            font-weight: 700;
            color: #fff;
        }

        /* رسالة التحميل */
        .btn-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .quick-login {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: white;
        }

        .quick-login button {
            margin: 5px;
            padding: 8px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: white;
            color: #667eea;
            font-weight: 600;
        }

        .quick-login button:hover {
            background: #f0f0f0;
        }
    </style>
</head>

<body>
    <!-- خلفية الجسيمات -->
    <div id="particles-js"></div>

    <div class="glass-card">
        <div class="logo">مهند الخضر</div>
        <h2>تسجيل الدخول</h2>

        <form id="loginForm">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" placeholder="البريد الإلكتروني" required>
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" placeholder="كلمة المرور" required>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="remember"> تذكرني
                </label>
                <div class="forgot">
                    <a href="#">نسيت كلمة المرور؟</a>
                </div>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span>دخول</span>
                <i class="fas fa-arrow-left"></i>
            </button>

            <div class="error-msg" id="errorMsg"></div>
        </form>

        <div class="register-link">
            ليس لديك حساب؟ <a href="register.html">سجل الآن</a>
        </div>

        <div class="demo-data">
            <span>بيانات تجريبية:</span> <br>
            <span></span> user@example.com / user123 (مستخدم)
        </div>
    </div>


    <script>
        // تهيئة خلفية الجسيمات
        particlesJS('particles-js', {
            particles: {
                number: { value: 100, density: { enable: true, value_area: 800 } },
                color: { value: '#ffffff' },
                shape: { type: 'star' },
                opacity: { value: 0.5, random: true },
                size: { value: 3, random: true },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: '#ffffff',
                    opacity: 0.2,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 2,
                    direction: 'none',
                    random: true,
                    straight: false,
                    out_mode: 'out',
                    bounce: false
                }
            },
            interactivity: {
                detect_on: 'canvas',
                events: {
                    onhover: { enable: true, mode: 'repulse' },
                    onclick: { enable: true, mode: 'push' },
                    resize: true
                },
                modes: {
                    repulse: { distance: 100, duration: 0.4 },
                    push: { particles_nb: 4 }
                }
            },
            retina_detect: true
        });

        // دوال التخزين المحلي
        function getUsers() {
            return JSON.parse(localStorage.getItem('users')) || [];
        }

        function saveUsers(users) {
            localStorage.setItem('users', JSON.stringify(users));
        }

        function getCurrentUser() {
            const local = localStorage.getItem('currentUser');
            const session = sessionStorage.getItem('currentUser');
            if (local) return JSON.parse(local);
            if (session) return JSON.parse(session);
            return null;
        }

        // تهيئة المستخدمين الافتراضيين
        (function initDefaultUsers() {
            const users = getUsers();
            if (users.length === 0) {
                const defaultUsers = [
                    {
                        id: 1,
                        fullname: 'مدير النظام',
                        username: 'admin',
                        email: 'vvvwqmohened@gmail.com',
                        password: '770423005',
                        role: 'admin',
                        verified: true,
                        createdAt: new Date().toISOString()
                    },
                    {
                        id: 2,
                        fullname: 'مستخدم عادي',
                        username: 'user',
                        email: 'user@example.com',
                        password: 'user123',
                        role: 'user',
                        verified: true,
                        createdAt: new Date().toISOString()
                    }
                ];
                saveUsers(defaultUsers);
            }
        })();
        /* 

        // إذا كان المستخدم مسجلاً بالفعل، توجيهه للصفحة المناسبة
        const currentUser = getCurrentUser();
        if (currentUser) {
            if (currentUser.role === 'user') window.location.href = 'index.html';
            else window.location.href = 'dashboard.html';
        }

        */


        // التحقق من وجود مستخدم حالي لعرض رابط سريع (اختياري)
        const existingUser = getCurrentUser();
        if (existingUser) {
            // عرض رسالة في الصفحة تفيد بوجود مستخدم مسجل مسبقاً
            const quickLoginDiv = document.createElement('div');
            quickLoginDiv.className = 'quick-login';
            quickLoginDiv.innerHTML = `
        <p>أنت مسجل الدخول كـ <strong>${existingUser.fullname}</strong></p>
        <button onclick="continueAsUser()">متابعة</button>
        <button onclick="logoutAndStay()">تسجيل الخروج</button>
    `;
            document.querySelector('.glass-card').appendChild(quickLoginDiv);
        }

        window.continueAsUser = function () {
            if (existingUser.role === 'user') window.location.href = 'index.html';
            else window.location.href = 'dashboard.html';
        };

        window.logoutAndStay = function () {
            localStorage.removeItem('currentUser');
            sessionStorage.removeItem('currentUser');
            window.location.reload(); // إعادة تحميل الصفحة لتحديث الحالة
        };

        // معالج تسجيل الدخول
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const remember = document.getElementById('remember').checked;
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');

            // تعطيل الزر وإظهار التحميل
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="btn-spinner"></span> جاري التحقق...';

            setTimeout(() => {
                const users = getUsers();
                const user = users.find(u => u.email === email && u.password === password);

                if (user) {
                    // حفظ الجلسة بدون كلمة المرور
                    const { password, ...userData } = user;
                    if (remember) {
                        localStorage.setItem('currentUser', JSON.stringify(userData));
                    } else {
                        sessionStorage.setItem('currentUser', JSON.stringify(userData));
                    }

                    // توجيه حسب الدور
                    if (user.role === 'user') {
                        window.location.href = 'index.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    errorMsg.textContent = '❌ البريد الإلكتروني أو كلمة المرور غير صحيحة';
                    errorMsg.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<span>دخول</span><i class="fas fa-arrow-left"></i>';
                }
            }, 800);
        });
    </script>
</body>

</html>
